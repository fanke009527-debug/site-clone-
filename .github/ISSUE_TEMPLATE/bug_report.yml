name: Bug Report
description: Report a bug in site-clone
title: "[BUG] "
labels: ["bug"]
body:
  - type: input
    id: url
    attributes:
      label: Target URL
      description: The URL you tried to clone
      placeholder: https://example.com
  - type: input
    id: skill_version
    attributes:
      label: Skill version
      placeholder: e.g. v2.0.0
  - type: input
    id: browser_mcp
    attributes:
      label: Browser MCP used
      placeholder: bouncy / Playwright / Chrome / Puppeteer
  - type: textarea
    id: what_happened
    attributes:
      label: What happened
      description: Describe the error — console messages, missing assets, visual glitches
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened
